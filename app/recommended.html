<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommendations | E-Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #000000;
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 30px 0 10px;
      font-size: 1.8rem;
      font-weight: 600;
      color: #ffd700;
    }

    .quote {
      font-size: 0.95rem;
      color: #ccc;
      margin-bottom: 30px;
      font-style: italic;
    }

    .recommend-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      padding: 40px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .book-card {
      background-color: #13132b;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .book-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    .book-cover {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
    }

    .book-title {
      color: #ffd700;
      font-weight: 600;
      font-size: 1.2rem;
      margin: 15px 0 5px;
    }

    .book-author {
      color: #aaa;
      font-size: 0.9rem;
    }

    .book-desc {
      color: #ccc;
      font-size: 0.85rem;
      margin: 10px 0;
    }

    .add-btn {
      background: #ffd700;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .add-btn:hover {
      background: #ffcc00;
    }
  </style>
</head>
<body>
  <header>✨ Recommended Reads</header>
  <p class="quote">"A reader lives a thousand lives before he dies." — George R.R. Martin</p>


<div id="recGrid"></div>
<script src="recommended.js"></script>

</body>
</html>
